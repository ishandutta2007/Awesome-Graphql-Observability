<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E535AB" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #FFFFFF; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 19px; fill: #9CA3AF; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #F3F4F6; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-glow { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .floating-card { animation: float 5s infinite ease-in-out; }
    .flowing-line { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Dynamic Background Elements (Glow Orbs & Flow Lines) -->
  <circle cx="150" cy="100" r="140" fill="#E535AB" opacity="0.15" class="pulsing-glow" filter="url(#glow)" />
  <circle cx="1050" cy="260" r="160" fill="#3B82F6" opacity="0.15" class="pulsing-glow" filter="url(#glow)" />

  <!-- Decorative Flow Waves / Nodes in Background -->
  <g opacity="0.25">
    <path d="M 100 280 Q 350 340 600 280 T 1100 280" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="flowing-line" />
    <path d="M 50 240 Q 400 180 750 240 T 1150 210" fill="none" stroke="#8B5CF6" stroke-width="1.5" class="flowing-line" />
  </g>

  <!-- Dynamic Graphic Pills / Nodes placed strategically (Non-overlapping with Title) -->
  <g class="floating-card" transform="translate(850, 40)">
    <rect width="280" height="70" rx="12" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="35" cy="35" r="16" fill="#E535AB" opacity="0.2" />
    <path d="M35 25 L43 40 L27 40 Z" fill="#E535AB" />
    <text x="65" y="32" class="badge-text" font-size="13">GraphQL Traces &amp; Spans</text>
    <text x="65" y="50" font-family="sans-serif" font-size="11" fill="#10B981">● 99.9% OpenTelemetry Native</text>
  </g>

  <g class="floating-card" transform="translate(890, 130)">
    <rect width="240" height="60" rx="12" fill="url(#cardGrad)" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="30" cy="30" r="14" fill="#3B82F6" opacity="0.2" />
    <circle cx="30" cy="30" r="6" fill="#3B82F6" />
    <text x="55" y="28" class="badge-text" font-size="13">Schema Analytics</text>
    <text x="55" y="44" font-family="sans-serif" font-size="11" fill="#6B7280">Field-level Usage Tracking</text>
  </g>

  <!-- Main Foreground Content (Header, Title, Subtitle, Badges) -->
  <g transform="translate(60, 0)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 55)">
      <rect width="250" height="30" rx="15" fill="url(#accentGrad)" opacity="0.2" />
      <rect width="250" height="30" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1" />
      <text x="125" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F472B6" letter-spacing="1">AWESOME OBSERVABILITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title">Awesome GraphQL Observability 🚀</text>

    <!-- Gradient Accent Bar under Title -->
    <rect x="0" y="165" width="480" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle / Description -->
    <text x="0" y="210" class="subtitle">Curated collection of GraphQL Metrics, OpenTelemetry Tracing, Schema Usage</text>
    <text x="0" y="235" class="subtitle">Analytics &amp; Performance Observability Platforms</text>

    <!-- Feature Pill Tags -->
    <g transform="translate(0, 270)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="32" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1" />
      <text x="70" y="20" text-anchor="middle" class="badge-text">📊 SaaS Platforms</text>

      <!-- Pill 2 -->
      <rect x="150" y="0" width="170" height="32" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1" />
      <text x="235" y="20" text-anchor="middle" class="badge-text">⚡ Open-Source Tools</text>

      <!-- Pill 3 -->
      <rect x="330" y="0" width="150" height="32" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1" />
      <text x="405" y="20" text-anchor="middle" class="badge-text">🔭 OpenTelemetry</text>
    </g>
  </g>
</svg>
